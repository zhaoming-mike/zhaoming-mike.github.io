<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='5' width='14' height='7' rx='1' fill='%23f90'/><rect x='3' y='2' width='3' height='3' rx='1' fill='%23f90'/><rect x='5' y='3' width='2' height='8' fill='%23f90'/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoT 坦克百科 — ASIA 服 (2026-06-27)</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background:#1a1a1a; color:#ccc; min-height:100vh; }
a { color:#f90; }
header { background:#222; border-bottom:2px solid #f90; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
header h1 { color:#f90; font-size:1.3em; white-space:nowrap; }
#toolbar { background:#252525; padding:10px 24px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:1px solid #333; position:sticky; top:0; z-index:100; }
#toolbar input[type=text] { background:#333; border:1px solid #555; color:#fff; padding:6px 12px; border-radius:4px; width:200px; font-size:0.9em; height:30px; box-sizing:border-box; }
#toolbar input[type=text]:focus { outline:none; border-color:#f90; }
#toolbar select { background:#333; border:1px solid #555; color:#fff; padding:4px 8px; border-radius:4px; font-size:0.85em; cursor:pointer; height:30px; box-sizing:border-box; }
#toolbar select:focus { outline:none; border-color:#f90; }
#toolbar label { font-size:0.82em; color:#aaa; display:flex; align-items:center; gap:4px; cursor:pointer; user-select:none; }
#toolbar label input { accent-color:#f90; }
#toolbar .btn { background:#f90; color:#000; border:none; padding:6px 14px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.85em; height:30px; box-sizing:border-box; }
#toolbar .btn:hover { background:#fb0; }
#tier-select { display:flex; gap:2px; }
#tier-select button { width:30px; height:30px; border:1px solid #555; background:#333; color:#aaa; border-radius:3px; cursor:pointer; font-size:0.75em; font-weight:bold; box-sizing:border-box; }
#tier-select button.active { background:#f90; color:#000; border-color:#f90; }
#nation-filter > span { height:30px; box-sizing:border-box; }
#tier-select button:hover:not(.active) { border-color:#999; color:#fff; }
#grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px; padding:16px 24px; contain:layout style; }
#grid .card { background:#252525; border:1px solid #333; border-radius:6px; padding:10px; cursor:pointer; transition:.15s; display:flex; flex-direction:column; align-items:center; text-align:center; user-select:none; position:relative; content-visibility:auto; contain-intrinsic-size:auto 160px; }
#grid .card:hover { border-color:#f90; background:#2a2a2a; transform:translateY(-1px); }
#grid .card.premium { background:#3a2e00; border-color:#a60; }
#grid .card.premium:hover { background:#4a3a00; }
#grid .card img { width:120px; height:50px; object-fit:contain; margin-bottom:6px; image-rendering:pixelated; }
#grid .card .name { font-size:0.9em; font-weight:bold; color:#fff; margin-bottom:2px; }
#grid .card .badges { display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
#grid .card .badge { font-size:0.65em; padding:1px 6px; border-radius:3px; font-weight:bold; }
.badge-tier { background:#f90; color:#000; }
.badge-premium { background:#c90; color:#000; }
.badge-gift { background:#6a5; color:#000; }
.badge-wheeled { background:#68c; color:#000; }
.badge-newest { color:#000; animation: badge-pulse 2s ease-in-out infinite; }
@keyframes badge-pulse { 0%,100% { box-shadow: 0 0 4px rgba(255,255,255,0.2); } 50% { box-shadow: 0 0 10px rgba(255,255,255,0.5); } }
#grid .card.newest { border-left-width: 3px; border-left-style: solid; }
.nation-bg-ussr { border-left:3px solid #e22; }
.nation-bg-germany { border-left:3px solid #888; }
.nation-bg-usa { border-left:3px solid #48f; }
.nation-bg-france { border-left:3px solid #47e; }
.nation-bg-uk { border-left:3px solid #c44; }
.nation-bg-china { border-left:3px solid #e44; }
.nation-bg-japan { border-left:3px solid #d4d; }
.nation-bg-czech { border-left:3px solid #fa0; }
.nation-bg-sweden { border-left:3px solid #48d; }
.nation-bg-poland { border-left:3px solid #e88; }
.nation-bg-italy { border-left:3px solid #4a4; }
#overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; justify-content:center; align-items:center; padding:20px; overflow-y:auto; }
#detail { background:#222; border:1px solid #444; border-radius:10px; width:min(1200px, 80vw); padding:28px 32px; position:relative; }
#detail h2 { color:#f90; font-size:1.5em; margin-bottom:2px; }
#detail .subtitle { color:#888; font-size:0.95em; margin-bottom:8px; }
#detail .close { position:absolute; top:12px; right:16px; background:none; border:none; color:#aaa; font-size:1.6em; cursor:pointer; }
#detail .close:hover { color:#fff; }
#detail .copy-btn { position:absolute; top:14px; right:52px; background:none; border:1px solid #555; color:#aaa; padding:3px 10px; border-radius:4px; cursor:pointer; font-size:0.8em; }
#detail .copy-btn:hover { color:#fff; border-color:#999; }
#detail .copy-btn.copied { color:#5d5; border-color:#5d5; }
#detail table { width:100%; border-collapse:collapse; margin:4px 0; font-size:0.92em; }
#detail table th { text-align:left; color:#999; font-weight:normal; padding:2px 6px; width:40%; white-space:nowrap; }
#detail table td { padding:2px 6px; color:#ddd; white-space:nowrap; }
#detail table tr:hover { background:#2a2a2a; }
#detail .section { margin-top:12px; border-top:1px solid #333; padding-top:8px; }
#detail .section h3 { color:#f90; font-size:1.05em; margin-bottom:4px; }
.detail-header { display:flex; gap:16px; align-items:center; margin-bottom:10px; }
.detail-header img { width:440px; height:auto; max-height:360px; object-fit:contain; flex-shrink:0; }
.detail-header .header-text { flex:1; min-width:0; }
@media (max-width:600px) { .detail-header { flex-direction:column; align-items:center; } }
.detail-desc { color:#bbb; font-size:0.95em; line-height:1.8; background:#2a2a2a; padding:8px 12px; border-radius:6px; border-left:3px solid #f90; }
#detail .ammo-lo { color: var(--ammo-lo, #f55); }
#detail .ammo-md { color: var(--ammo-md, #fff); }
#detail .ammo-hi { color: var(--ammo-hi, #5d5); }
.ammo-table { border-collapse:collapse; width:100%; }
#detail .ammo-table th, #detail .ammo-table td { text-align:right; font-size:0.88em; padding:2px 6px; white-space:nowrap; }
#detail .ammo-table th.ammo-label, #detail .ammo-table th.ammo-arrow, #detail .ammo-table th[rowspan], #detail .ammo-table th[colspan] { text-align:center; }
.ammo-table td, .ammo-table th { background:#2a2a2a; border:1px solid #444; }
#detail .ammo-top th, #detail .ammo-top td { background:#5a4200; }
#detail .ammo-top:hover th, #detail .ammo-top:hover td { background:#6b5200; }
#detail .ammo-top th.ammo-label { color:#f90; }
.ammo-table tr:hover td, .ammo-table tr:hover th { background:#333; }
.ammo-table td { white-space:nowrap; }
#detail .crew-list { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; align-items:center; align-content:center; }
#detail .crew-list span { background:#333; padding:2px 8px; border-radius:3px; font-size:0.88em; }
.three-col { display:flex; gap:16px; }
.three-col + .three-col { margin-top:12px; }
#detail .three-col .section { flex:1; min-width:0; margin-top:12px; border-top:1px solid #333; padding-top:8px; }
@media (max-width:700px) { .three-col { flex-direction:column; } }
.no-results { grid-column:1/-1; text-align:center; padding:60px; color:#666; font-size:1.1em; }
#back-to-top { position:fixed; bottom:20px; right:20px; width:36px; height:36px; background:#333; border:1px solid #555; border-radius:50%; color:#aaa; font-size:1.2em; cursor:pointer; display:none; z-index:300; align-items:center; justify-content:center; transition:.2s; line-height:0; }
#back-to-top:hover { background:#f90; border-color:#f90; }
#back-to-top:hover span { border-bottom-color:#000; }
</style>
</head>
<body>
<header>
  <h1>WoT 坦克百科 · ASIA</h1>
</header>
<div id="toolbar">
  <span style="position:relative;display:inline-block">
    <input type="text" id="search" placeholder="搜索坦克名称...">
    <button id="search-clear" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:#999;cursor:pointer;font-size:1.1em;display:none;padding:0 4px;line-height:1">&times;</button>
  </span>
  <span id="nation-filter" style="display:inline-flex;align-items:center;gap:4px"></span>
  <span id="type-filter" style="display:inline-flex;align-items:center;gap:4px"></span>
  <div id="tier-select"></div>
  <label><input type="checkbox" id="premium-only"> 仅金币车</label>
  <label><input type="checkbox" id="wheeled-only"> 仅轮式</label>
  <span id="newest-filter" style="display:inline-flex;align-items:center;gap:4px"></span>
  <select id="sort-by">
    <option value="tier">按等级</option>
    <option value="nation">按系别</option>
    <option value="name">按名称</option>
    <option value="type">按类型</option>
    <option value="tank_id">按ID</option>
  </select>
  <button id="reset-filters" class="btn" style="background:#555;color:#ccc">重置</button>
  <span style="font-size:0.8em;color:#888;margin-left:auto">
    <span>符合条件: <b id="stat-shown" style="color:#f90">0</b></span>
    <span style="margin-left:10px">金币车: <b id="stat-premium" style="color:#fff">0</b></span>
    <span style="margin-left:10px">总计: <b id="stat-total" style="color:#fff">0</b></span>
    <span style="margin-left:10px">新车: <b id="stat-newest" style="color:#0cf">0</b></span>
  </span>
</div>
<div id="grid"></div>
<div id="back-to-top" onclick="scrollToTop()" style="display:flex" title="回到顶部"><span style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:10px solid #aaa"></span></div>
<div id="overlay"><div id="detail"><button class="close">&times;</button><button class="copy-btn" id="copyBtn" title="复制坦克信息">复制</button><div id="detail-content"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="tank-data/vehicles_data.js"></script>
<script src="tank-data/tank_nicknames.js"></script>
<script src="tank-data/tank_newest.js"></script>
<script>
function toRoman(n) { return ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'][n]||n; }

function localImg(url) {
  if (!url) return '';
  var parts = url.split('/');
  var fname = parts[parts.length-1];
  if (url.indexOf('/small/') !== -1) return 'images/small_icon/'+fname;
  if (url.indexOf('/contour/') !== -1) return 'images/contour_icon/'+fname;
  return 'images/big_icon/'+fname;
}
const NATION_NAMES = {
  ussr:'苏联', germany:'德国', usa:'美国', france:'法国', uk:'英国',
  china:'中国', japan:'日本', czech:'捷克', sweden:'瑞典', poland:'波兰', italy:'意大利'
};
const NATION_FLAG = {
  ussr:'ru.png', germany:'de.png', usa:'us.png', france:'fr.png', uk:'gb.png',
  china:'cn.png', japan:'jp.png', czech:'cz.png', sweden:'se.png', poland:'pl.png', italy:'it.png'
};
const TYPE_NAMES = {
  heavyTank:'重型坦克', mediumTank:'中型坦克', lightTank:'轻型坦克', 'AT-SPG':'自行反坦克炮', SPG:'自行火炮'
};
const NATION_ORDER = ['ussr','germany','usa','france','uk','china','japan','czech','sweden','poland','italy'];
const TYPE_ORDER = ['heavyTank','mediumTank','lightTank','AT-SPG','SPG'];
const TYPE_ICON = { heavyTank:'HT.svg', mediumTank:'MT.svg', lightTank:'LT.svg', 'AT-SPG':'TD.svg', SPG:'SPG.svg' };

let vehicles = [];
let filtered = [];
let filters = { nations:new Set(), types:new Set(), tiers:new Set(), premium:false, wheeled:false, newestBatches:new Set(), search:'' };
let sortBy = 'tier';

function init() {
  vehicles = Object.values(VEHICLES_JSON.data);
  initUI(vehicles);
  applyFilters();
}

function initUI(data) {
  const nations = [...new Set(data.map(v=>v.nation))].sort((a,b)=>NATION_ORDER.indexOf(a)-NATION_ORDER.indexOf(b));
  const nc = document.getElementById('nation-filter');
  nations.forEach(n => {
    const b = document.createElement('span');
    b.style.cssText = 'display:inline-flex;align-items:center;padding:3px 5px;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:0.82em;user-select:none;background:#333;color:#aaa';
    b.title = NATION_NAMES[n]||n;
    b.dataset.nation = n;
    b.innerHTML = '<span style="display:inline-block;width:1.2em;height:0.85em;background:url(images/flags/'+(NATION_FLAG[n]||'')+')center/contain no-repeat"></span>';
    b.onclick = function() {
      if (filters.nations.has(n)) {
        filters.nations.delete(n);
        b.style.borderColor = '#555';
        b.style.background = '#333';
        b.style.color = '#aaa';
      } else {
        filters.nations.add(n);
        b.style.borderColor = '#f90';
        b.style.background = '#3a3000';
        b.style.color = '#f90';
      }
      applyFilters();
    };
    nc.appendChild(b);
  });
  var types = ['heavyTank','mediumTank','lightTank','AT-SPG','SPG'];
  var tc2 = document.getElementById('type-filter');
  types.forEach(function(t) {
    var b = document.createElement('span');
    b.style.cssText = 'display:inline-flex;align-items:center;padding:3px 5px;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:0.82em;user-select:none;background:#333;color:#aaa';
    b.title = TYPE_NAMES[t]||t;
    b.dataset.type = t;
    b.innerHTML = '<img src="images/class-icons/'+(TYPE_ICON[t]||'')+'" style="height:'+(t==='AT-SPG'||t==='SPG'?'0.75':'1')+'em;width:auto;opacity:0.6" alt="">';
    b.onclick = function() {
      if (filters.types.has(t)) {
        filters.types.delete(t);
        b.style.borderColor = '#555';
        b.style.background = '#333';
      } else {
        filters.types.add(t);
        b.style.borderColor = '#f90';
        b.style.background = '#3a3000';
      }
      applyFilters();
    };
    tc2.appendChild(b);
  });
  // 批次过滤按钮
  if (typeof NEWEST_TANK_BATCHES !== 'undefined') {
    var nc3 = document.getElementById('newest-filter');
    NEWEST_TANK_BATCHES.forEach(function(batch) {
      var b = document.createElement('span');
      var c = batch.color || '#0cf';
      b.style.cssText = 'display:inline-flex;align-items:center;padding:3px 8px;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:0.78em;user-select:none;background:#333;color:'+c+';font-weight:bold;letter-spacing:0.03em';
      b.title = batch.label;
      b.dataset.batchDate = batch.date;
      b.textContent = batch.short;
      b.onclick = function() {
        if (filters.newestBatches.has(batch.date)) {
          filters.newestBatches.delete(batch.date);
          b.style.borderColor = '#555';
          b.style.background = '#333';
        } else {
          filters.newestBatches.add(batch.date);
          b.style.borderColor = c;
          b.style.background = c + '22';
        }
        applyFilters();
      };
      nc3.appendChild(b);
    });
  }
  function toRoman(n) { return ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'][n]||n; }
  const tiers = [...new Set(data.map(v=>v.tier))].sort((a,b)=>a-b);
  const tc = document.getElementById('tier-select');
  tiers.forEach(t => {
    const b = document.createElement('button');
    b.textContent = toRoman(t); b.dataset.tier = t;
    b.onclick = ()=>{ b.classList.toggle('active'); updateTierFilter(); };
    tc.appendChild(b);
  });
  document.getElementById('stat-total').textContent = data.length;
  document.getElementById('stat-premium').textContent = data.filter(v=>v.is_premium).length;
  document.getElementById('stat-newest').textContent = data.filter(v=>NEWEST_TANK_IDS.has(v.tank_id)).length;
}

function updateTierFilter() {
  filters.tiers = new Set();
  document.querySelectorAll('#tier-select button.active').forEach(b => filters.tiers.add(Number(b.dataset.tier)));
  applyFilters();
}

function applyFilters() {
  filters.premium = document.getElementById('premium-only').checked;
  filters.wheeled = document.getElementById('wheeled-only').checked;
  // newestBatches 已通过在批次按钮 onclick 中修改 Set 来维护，此处无需从 DOM 读取
  filters.search = document.getElementById('search').value.toLowerCase().trim();
  sortBy = document.getElementById('sort-by').value;
  filtered = vehicles.filter(v => {
    if (filters.nations.size > 0 && !filters.nations.has(v.nation)) return false;
    if (filters.types.size > 0 && !filters.types.has(v.type)) return false;
    if (filters.tiers.size > 0 && !filters.tiers.has(v.tier)) return false;
    if (filters.premium && !v.is_premium) return false;
    if (filters.wheeled && !v.is_wheeled) return false;
    if (filters.newestBatches.size > 0) {
      var batchInfos = NEWEST_BATCH_MAP[v.tank_id];
      if (!batchInfos) return false;
      var ok = false;
      for (var i = 0; i < NEWEST_TANK_BATCHES.length; i++) {
        if (!filters.newestBatches.has(NEWEST_TANK_BATCHES[i].date)) continue;
        for (var j = 0; j < batchInfos.length; j++) {
          if (batchInfos[j].short === NEWEST_TANK_BATCHES[i].short) { ok = true; break; }
        }
        if (ok) break;
      }
      if (!ok) return false;
    }
    if (filters.search && !v.name.toLowerCase().includes(filters.search) && !(v.short_name||'').toLowerCase().includes(filters.search) && !(TANK_NICKNAMES[v.tank_id]||'').toLowerCase().includes(filters.search)) return false;
    return true;
  });
  filtered.sort((a,b) => {
    switch(sortBy) {
      case 'tier': return a.tier - b.tier || NATION_ORDER.indexOf(a.nation) - NATION_ORDER.indexOf(b.nation);
      case 'nation': return NATION_ORDER.indexOf(a.nation) - NATION_ORDER.indexOf(b.nation) || a.tier - b.tier;
      case 'name': return a.name.localeCompare(b.name);
      case 'type': return TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type) || a.tier - b.tier;
      case 'tank_id': return a.tank_id - b.tank_id;
      default: return 0;
    }
  });
  renderGrid();
  document.getElementById('stat-shown').textContent = filtered.length;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">没有匹配的坦克</div>';
    return;
  }
  grid.innerHTML = filtered.map(v => {
    var badges = [];
    var batchInfos = NEWEST_BATCH_MAP[v.tank_id];
    var cardGlow = '';
    if (batchInfos) {
      for (var bi = 0; bi < batchInfos.length; bi++) {
        var biColor = batchInfos[bi].color;
        badges.push('<span class="badge badge-newest" style="background:'+biColor+'">' + batchInfos[bi].short + '</span>');
      }
      // 卡片发光色取第一个（最新）批次的颜色
      var glowColor = batchInfos[0].color;
      cardGlow = ' style="border-left-color:'+glowColor+';box-shadow:0 0 8px '+glowColor+'44"';
    }
    if (v.is_gift) badges.push('<span class="badge badge-gift">礼包</span>');
    if (v.is_wheeled) badges.push('<span class="badge badge-wheeled">轮式</span>');
    const img = v.images && (v.images.big_icon || v.images.contour_icon || v.images.small_icon) ? localImg(v.images.big_icon || v.images.contour_icon || v.images.small_icon) : '';
    return '<div class="card nation-bg-'+v.nation+(v.is_premium?' premium':'')+(batchInfos?' newest':'')+'"'+cardGlow+' onclick="showDetail('+v.tank_id+')">'+
      '<span style="position:absolute;top:4px;left:5px;font-size:0.62em;color:#666">#'+v.tank_id+'</span>'+
      '<span style="position:absolute;top:4px;right:5px;font-size:0.68em;color:#f90;font-weight:bold">'+toRoman(v.tier)+'</span>'+
      (v.is_premium?'<span style="position:absolute;bottom:4px;left:6px;font-size:0.58em;color:#c90;font-weight:bold">金币</span>':'')+
      '<img src="'+img+'" alt="'+v.name+'" loading="lazy" onerror="this.style.display=\'none\'">'+
      '<div class="name"><img src="images/class-icons/'+(TYPE_ICON[v.type]||'')+'" style="height:'+(v.type==='AT-SPG'||v.type==='SPG'?'0.7':'0.85')+'em;width:auto;opacity:0.55;vertical-align:middle;margin-right:5px" alt="">'+(TANK_NICKNAMES[v.tank_id]?'<span style="color:#f90;">'+TANK_NICKNAMES[v.tank_id]+'</span> ':'')+(v.short_name||v.name)+'</div>'+
      '<img src="images/flags/'+(NATION_FLAG[v.nation]||'')+'" style="position:absolute;bottom:5px;right:6px;height:0.9em;width:auto;opacity:0.5" title="'+(NATION_NAMES[v.nation]||v.nation)+'" alt="">'+
      '<div class="badges" style="min-height:1.2em">'+badges.join('')+'</div>'+
      '</div>';
  }).join('');
}

function showDetail(tankId) {
  var v = vehicles.find(function(t){return t.tank_id===tankId});
  if (!v) return;
  var p = v.default_profile || {};
  var overlay = document.getElementById('overlay');
  var content = document.getElementById('detail-content');
  var html = '<div class="detail-header">';
  if (v.images && v.images.big_icon) html += '<img src="'+localImg(v.images.big_icon)+'" onerror="this.style.display=\'none\'">';
  html += '<div class="header-text">';
  html += '<h2>'+(TANK_NICKNAMES[v.tank_id]?'<span style="color:#f90;">'+TANK_NICKNAMES[v.tank_id]+'</span> ':'')+(v.short_name||v.name);
html += (v.short_name&&v.short_name!==v.name?' <span style="color:#888;font-weight:normal">|</span> <span style="color:#fff;font-weight:normal">'+v.name+'</span>':'');
html += ' <span style="color:#666;font-size:0.55em;font-weight:normal">#'+v.tank_id+'</span></h2>';
  html += '<div class="subtitle"><span style="display:inline-flex;align-items:center;gap:3px"><span style="display:inline-block;width:1.1em;height:0.75em;background:url(images/flags/'+(NATION_FLAG[v.nation]||'')+')center/contain no-repeat"></span>'+(NATION_NAMES[v.nation]||v.nation)+'</span> · '+toRoman(v.tier)+' · <span style="display:inline-flex;align-items:center;gap:2px"><img src="images/class-icons/'+(TYPE_ICON[v.type]||'')+'" style="height:0.9em;width:auto;opacity:0.6" alt="">'+(TYPE_NAMES[v.type]||v.type)+'</span> · ID: '+v.tank_id;
  html += (v.is_premium?' · 金币车':'')+(v.is_gift?' · 礼包车':'')+(v.is_wheeled?' · 轮式':'');
  html += ' · 价格: '+(v.price_credit?v.price_credit.toLocaleString()+' 银币':'无');
  html += (v.price_gold?' / '+v.price_gold+' 金币':'')+'</div>';
  if (v.description) html += '<p class="detail-desc">'+v.description+'</p>';
  html += '</div></div>';
  html += '<div class="three-col"><div class="section"><h3>基本性能</h3><table>';
  html += '<tr><th>生命值 (HP)</th><td>'+(p.hp||'无')+'</td><th>重量 (吨)</th><td>'+((p.weight||0)/1000).toFixed(1)+'</td></tr>';
  html += '<tr><th>极速 (km/h)</th><td>'+(p.speed_forward||'无')+' / '+(p.speed_backward||'无')+'</td><th>视野 (m)</th><td>'+(p.turret?p.turret.view_range||'无':'无')+'</td></tr>';
  html += '<tr><th>车体转向 (°/s)</th><td>'+(p.suspension?p.suspension.traverse_speed||'无':'无')+'</td><th>炮塔转向 (°/s)</th><td>'+(p.turret?p.turret.traverse_speed||'无':'无')+'</td></tr>';
  html += '<tr><th>电台 (m)</th><td>'+(p.radio?p.radio.signal_range||'无':'无')+'</td><th>备弹 (发)</th><td>'+(p.max_ammo||'无')+'</td></tr>';
  html += '</table></div>';
  if (p.armor) {
    var a = p.armor;
    html += '<div class="section"><h3>装甲 (mm)</h3><table><tr><th></th><th>车体</th><th>炮塔</th></tr>';
    html += '<tr><td>正面</td><td style="color:#f90;font-weight:bold">'+(a.hull&&a.hull.front!=null?a.hull.front:'无')+'</td><td style="color:#f90;font-weight:bold">'+(a.turret&&a.turret.front!=null?a.turret.front:'无')+'</td></tr>';
    html += '<tr><td>侧面</td><td>'+(a.hull&&a.hull.sides!=null?a.hull.sides:'无')+'</td><td>'+(a.turret&&a.turret.sides!=null?a.turret.sides:'无')+'</td></tr>';
    html += '<tr><td>后部</td><td>'+(a.hull&&a.hull.rear!=null?a.hull.rear:'无')+'</td><td>'+(a.turret&&a.turret.rear!=null?a.turret.rear:'无')+'</td></tr>';
    html += '</table></div>';
  }
  if (p.gun) {
    html += '<div class="section"><h3>主炮: '+(p.gun.name||'')+'</h3><table>';
    html += '<tr><th>口径 (mm)</th><td>'+(p.gun.caliber||'无')+'</td><th>射速 (发/分钟)</th><td>'+(p.gun.fire_rate?p.gun.fire_rate.toFixed(1):'无')+'</td></tr>';
    html += '<tr><th>装填 (s)</th><td>'+(p.gun.reload_time?p.gun.reload_time.toFixed(1):'无')+'</td><th>瞄准 (s)</th><td>'+(p.gun.aim_time?p.gun.aim_time.toFixed(1):'无')+'</td></tr>';
    html += '<tr><th>百米精度</th><td>'+(p.gun.dispersion?(p.gun.dispersion*100).toFixed(2):'无')+'</td><th>俯角 / 仰角</th><td>'+(p.gun.move_down_arc!=null?p.gun.move_down_arc+'°':'无')+' / '+(p.gun.move_up_arc!=null?p.gun.move_up_arc+'°':'无')+'</td></tr>';
    html += '</table></div>';
  }
  html += '</div>';
  html += '<div class="three-col">';
  if (p.ammo && p.ammo.length > 0) {
    var ammoLabels = {ARMOR_PIERCING:'AP', ARMOR_PIERCING_CR:'APCR', HOLLOW_CHARGE:'HEAT', HIGH_EXPLOSIVE:'HE'};
    var cls = ['ammo-lo','ammo-md','ammo-hi'];
    var tip = ['远距离 (75%)','标准 (100%)','近距离 (125%)'];
    html += '<div class="section"><h3>弹药</h3><table class="ammo-table">';
    html += '<tr><th class="ammo-label">弹药</th><th colspan="3">穿透 (mm) <span class="ammo-lo">−</span>/<span class="ammo-hi">+</span>25%</th><th colspan="3">伤害 (HP) <span class="ammo-lo">−</span>/<span class="ammo-hi">+</span>25%</th></tr>';
    var maxPen = 0;
    p.ammo.forEach(function(a){ var pn = (a.penetration||[])[1]||0; if (pn>maxPen) maxPen=pn; });
    p.ammo.forEach(function(a){
      var pen = a.penetration || [];
      var dmg = a.damage || [];
      var isTop = maxPen > 0 && pen[1] === maxPen;
      html += '<tr'+(isTop?' class="ammo-top"':'')+'><th class="ammo-label">'+(ammoLabels[a.type]||a.type)+'</th>';
      for (var i = 0; i < 3; i++) html += '<td class="'+cls[i]+'" title="'+tip[i]+'">'+(pen[i]||'无')+'</td>';
      for (var i = 0; i < 3; i++) html += '<td class="'+cls[i]+'" title="'+tip[i]+'">'+(dmg[i]||'无')+'</td>';
      html += '</tr>';
    });
    html += '</table></div>';
  }
  if (p.engine) {
    html += '<div class="section"><h3>发动机</h3><table>';
    html += '<tr><th>名称</th><td>'+(p.engine.name||'无')+'</td><th>功率 (匹)</th><td>'+(p.engine.power||'无')+'</td></tr>';
    html += '<tr><th>重量 (kg)</th><td>'+(p.engine.weight||'无')+'</td><th>着火率 (%)</th><td>'+(p.engine.fire_chance!=null?(p.engine.fire_chance*100).toFixed(0):'无')+'</td></tr>';
    html += '</table></div>';
  }
  if (v.crew && v.crew.length > 0) {
    html += '<div class="section"><h3>车组</h3><div class="crew-list">';
    v.crew.forEach(function(c){
      html += '<span>'+(c.roles.commander||c.roles.gunner||c.roles.driver||c.roles.loader||c.roles.radioman||c.member_id)+'</span>';
    });
    html += '</div></div>';
  }
  html += '</div>';
  content.innerHTML = html;
  overlay.style.display = 'flex';
}

document.getElementById('overlay').onclick = function(e) {
  if (e.target === this) { this.style.display = 'none'; }
};
document.querySelector('#detail .close').onclick = function(){ document.getElementById('overlay').style.display = 'none'; };
document.getElementById('copyBtn').onclick = function(){
  var btn = this;
  btn.textContent = '截图中...';
  html2canvas(document.getElementById('detail'), { backgroundColor: '#222', scale: 2 }).then(function(canvas) {
    canvas.toBlob(function(blob) {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function() {
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(function(){ btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
      }).catch(function() {
        btn.textContent = '复制失败';
        setTimeout(function(){ btn.textContent = '复制'; }, 2000);
      });
    });
  }).catch(function(e) {
    console.error(e);
    btn.textContent = '截图失败';
    setTimeout(function(){ btn.textContent = '复制'; }, 2000);
  });
};
var searchInput = document.getElementById('search');
var searchClear = document.getElementById('search-clear');
searchInput.addEventListener('input', function() {
  searchClear.style.display = this.value ? 'inline' : 'none';
  applyFilters();
});
searchClear.addEventListener('click', function() {
  searchInput.value = '';
  searchClear.style.display = 'none';
  searchInput.focus();
  applyFilters();
});
document.getElementById('premium-only').addEventListener('change', applyFilters);
document.getElementById('wheeled-only').addEventListener('change', applyFilters);
document.getElementById('sort-by').addEventListener('change', applyFilters);
document.addEventListener('keydown', function(e){ if (e.key==='Escape') document.getElementById('overlay').style.display='none'; });
window.addEventListener('beforeunload', function() { saveFilters(); });
function saveFilters() {
  var state = {
    search: document.getElementById('search').value,
    premium: document.getElementById('premium-only').checked,
    wheeled: document.getElementById('wheeled-only').checked,
    newestBatches: Array.from(filters.newestBatches),
    sortBy: document.getElementById('sort-by').value,
    nations: Array.from(filters.nations),
    types: Array.from(filters.types),
    tiers: Array.from(filters.tiers)
  };
  localStorage.setItem('wot-filters', JSON.stringify(state));
}

function restoreFilters() {
  var raw = localStorage.getItem('wot-filters');
  if (!raw) return;
  try {
    var state = JSON.parse(raw);
    document.getElementById('search').value = state.search || '';
    if (state.search) { searchClear.style.display = 'inline'; }
    document.getElementById('premium-only').checked = state.premium || false;
    document.getElementById('wheeled-only').checked = state.wheeled || false;
    document.getElementById('sort-by').value = state.sortBy || 'tier';
    filters.newestBatches = new Set(state.newestBatches || []);
    filters.nations = new Set(state.nations || []);
    filters.types = new Set(state.types || []);
    filters.tiers = new Set(state.tiers || []);
    document.querySelectorAll('#type-filter > span').forEach(function(b) {
      if (filters.types.has(b.dataset.type)) {
        b.style.borderColor = '#f90'; b.style.background = '#3a3000';
      }
    });
    document.querySelectorAll('#nation-filter > span').forEach(function(b) {
      if (filters.nations.has(b.dataset.nation)) {
        b.style.borderColor = '#f90'; b.style.background = '#3a3000'; b.style.color = '#f90';
      }
    });
    document.querySelectorAll('#tier-select button').forEach(function(b) {
      if (filters.tiers.has(Number(b.dataset.tier))) b.classList.add('active');
    });
    document.querySelectorAll('#newest-filter > span').forEach(function(b) {
      if (filters.newestBatches.has(b.dataset.batchDate)) {
        var bc = b.style.color; // 按钮的文字色就是批次色
        b.style.borderColor = bc;
        b.style.background = bc + '22';
      }
    });
    applyFilters();
  } catch(e) {}
}

(function() {
  function setFingerprint(key, val) {
    if (!localStorage.getItem(key)) localStorage.setItem(key, val);
  }
  setFingerprint('wot-fp-data', JSON.stringify(VEHICLES_JSON.data).length);
  setFingerprint('wot-fp-html', document.documentElement.outerHTML.length);

  var files = [
    {url:'tank-data/vehicles_data.js', key:'wot-fp-data', extract:function(t){
      var m = t.match(/VEHICLES_JSON\s*=\s*(\{[\s\S]*\});/);
      return m ? m[1].length : 0;
    }},
    {url:'tank-data/tank_nicknames.js', key:'wot-fp-nick', extract:function(t){ return t.length; }},
    {url:'tank-data/tank_newest.js', key:'wot-fp-newest', extract:function(t){ return t.length; }},
    {url:'index.html', key:'wot-fp-html', extract:function(t){ return t.length; }}
  ];

  function poll() {
    var changed = false;
    Promise.allSettled(files.map(function(f) {
      return fetch(f.url + '?t=' + Date.now(), {cache:'no-cache'})
        .then(function(r) { return r.text(); })
        .then(function(txt) {
          var fp = f.extract(txt);
          if (fp && Number(localStorage.getItem(f.key)) !== fp) {
            localStorage.setItem(f.key, fp);
            changed = true;
          }
        });
    })).then(function() {
      if (changed) { saveFilters(); location.reload(); }
    });
  }
  setInterval(poll, 30000);
  poll();
})();

document.getElementById('reset-filters').addEventListener('click', function() {
  document.getElementById('search').value = '';
  searchClear.style.display = 'none';
  document.getElementById('type-filter').value = '';
  document.getElementById('premium-only').checked = false;
  document.getElementById('wheeled-only').checked = false;
  document.getElementById('sort-by').value = 'tier';
  filters.newestBatches.clear();
  filters.nations.clear();
  filters.types.clear();
  filters.tiers.clear();
  document.querySelectorAll('#type-filter > span').forEach(function(b) {
    b.style.borderColor = '#555';
    b.style.background = '#333';
  });
  document.querySelectorAll('#nation-filter > span').forEach(function(b) {
    b.style.borderColor = '#555';
    b.style.background = '#333';
    b.style.color = '#aaa';
  });
  document.querySelectorAll('#tier-select button.active').forEach(function(b) {
    b.classList.remove('active');
  });
  document.querySelectorAll('#newest-filter > span').forEach(function(b) {
    b.style.borderColor = '#555';
    b.style.background = '#333';
  });
  applyFilters();
});
function scrollToTop() {
  var s = window.scrollY, step = s / 8;
  function f() {
    if (window.scrollY > 0) { window.scrollBy(0, -Math.max(step, 30)); requestAnimationFrame(f); }
  }
  requestAnimationFrame(f);
}
var btt = document.getElementById('back-to-top');
window.addEventListener('scroll', function() {
  btt.style.display = window.scrollY > 300 ? 'flex' : 'none';
});
init();
restoreFilters();
</script>
