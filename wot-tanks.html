<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='5' width='14' height='7' rx='1' fill='%23f90'/><rect x='3' y='2' width='3' height='3' rx='1' fill='%23f90'/><rect x='5' y='3' width='2' height='8' fill='%23f90'/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoT 坦克百科 — ASIA 服 (2026-08-17)</title>
<link rel="stylesheet" href="wot-tanks-style.css">
</head>
<body>
<header>
  <h1>WoT 坦克百科 · ASIA</h1>
</header>
<div id="toolbar">
  <span style="position:relative;display:inline-block">
    <input type="text" id="search" placeholder="搜索坦克名称...">
    <button id="search-clear" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:#999;cursor:pointer;font-size:1.1em;display:none;padding:0 4px;line-height:1">&times;</button>
  </span>
  <span id="nation-filter" style="display:inline-flex;align-items:center;gap:4px"></span>
  <span id="type-filter" style="display:inline-flex;align-items:center;gap:4px"></span>
  <div id="tier-select"></div>
  <label><input type="checkbox" id="premium-only"> 仅金币车</label>
  <label><input type="checkbox" id="wheeled-only"> 仅轮式</label>
  <span id="newest-filter" style="display:inline-flex;align-items:center;gap:4px"></span>
  <select id="sort-by">
    <option value="tier">按等级</option>
    <option value="nation">按系别</option>
    <option value="name">按名称</option>
    <option value="type">按类型</option>
    <option value="tank_id">按ID</option>
  </select>
  <button id="reset-filters" class="btn" style="background:#555;color:#ccc">重置</button>
  <span style="font-size:0.8em;color:#888;margin-left:auto">
    <span>符合条件: <b id="stat-shown" style="color:#f90">0</b></span>
    <span style="margin-left:10px">金币车: <b id="stat-premium" style="color:#fff">0</b></span>
    <span style="margin-left:10px">总计: <b id="stat-total" style="color:#fff">0</b></span>
    <span style="margin-left:10px">新车: <b id="stat-newest" style="color:#0cf">0</b></span>
  </span>
</div>
<div id="grid"></div>
<div id="back-to-top" onclick="scrollToTop()" style="display:flex" title="回到顶部"><span style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:10px solid #aaa"></span></div>
<div id="overlay"><div id="detail"><button class="close">&times;</button><button class="copy-btn" id="copyBtn" title="复制坦克信息">复制</button><div id="detail-content"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="tank-data/vehicles_data.js"></script>
<script src="tank-data/tank_nicknames.js"></script>
<script src="tank-data/tank_newest.js"></script>
<script src="wot-tanks-detail.js"></script>
<script>
const NATION_ORDER = ['ussr','germany','usa','france','uk','china','japan','czech','sweden','poland','italy'];
const TYPE_ORDER = ['heavyTank','mediumTank','lightTank','AT-SPG','SPG'];

let vehicles = [];
let filtered = [];
let filters = { nations:new Set(), types:new Set(), tiers:new Set(), premium:false, wheeled:false, newestBatches:new Set(), search:'' };
let sortBy = 'tier';

function init() {
  vehicles = Object.values(VEHICLES_JSON.data);
  initUI(vehicles);
  applyFilters();
}

function initUI(data) {
  const nations = [...new Set(data.map(v=>v.nation))].sort((a,b)=>NATION_ORDER.indexOf(a)-NATION_ORDER.indexOf(b));
  const nc = document.getElementById('nation-filter');
  nations.forEach(n => {
    const b = document.createElement('span');
    b.style.cssText = 'display:inline-flex;align-items:center;padding:3px 5px;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:0.82em;user-select:none;background:#333;color:#aaa';
    b.title = NATION_NAMES[n]||n;
    b.dataset.nation = n;
    b.innerHTML = '<span style="display:inline-block;width:1.2em;height:0.85em;background:url(images/flags/'+(NATION_FLAG[n]||'')+')center/contain no-repeat"></span>';
    b.onclick = function() {
      if (filters.nations.has(n)) {
        filters.nations.delete(n);
        b.style.borderColor = '#555';
        b.style.background = '#333';
        b.style.color = '#aaa';
      } else {
        filters.nations.add(n);
        b.style.borderColor = '#f90';
        b.style.background = '#3a3000';
        b.style.color = '#f90';
      }
      applyFilters();
    };
    nc.appendChild(b);
  });
  var types = ['heavyTank','mediumTank','lightTank','AT-SPG','SPG'];
  var tc2 = document.getElementById('type-filter');
  types.forEach(function(t) {
    var b = document.createElement('span');
    b.style.cssText = 'display:inline-flex;align-items:center;padding:3px 5px;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:0.82em;user-select:none;background:#333;color:#aaa';
    b.title = TYPE_NAMES[t]||t;
    b.dataset.type = t;
    b.innerHTML = '<img src="images/class-icons/'+(TYPE_ICON[t]||'')+'" style="height:'+(t==='AT-SPG'||t==='SPG'?'0.75':'1')+'em;width:auto;opacity:0.6" alt="">';
    b.onclick = function() {
      if (filters.types.has(t)) {
        filters.types.delete(t);
        b.style.borderColor = '#555';
        b.style.background = '#333';
      } else {
        filters.types.add(t);
        b.style.borderColor = '#f90';
        b.style.background = '#3a3000';
      }
      applyFilters();
    };
    tc2.appendChild(b);
  });
  // 批次过滤按钮
  if (typeof NEWEST_TANK_BATCHES !== 'undefined') {
    var nc3 = document.getElementById('newest-filter');
    NEWEST_TANK_BATCHES.forEach(function(batch) {
      var b = document.createElement('span');
      var c = batch.color || '#0cf';
      b.style.cssText = 'display:inline-flex;align-items:center;padding:3px 8px;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:0.78em;user-select:none;background:#333;color:'+c+';font-weight:bold;letter-spacing:0.03em';
      b.title = batch.label;
      b.dataset.batchDate = batch.date;
      b.textContent = batch.short;
      b.onclick = function() {
        if (filters.newestBatches.has(batch.date)) {
          filters.newestBatches.delete(batch.date);
          b.style.borderColor = '#555';
          b.style.background = '#333';
        } else {
          filters.newestBatches.add(batch.date);
          b.style.borderColor = c;
          b.style.background = c + '22';
        }
        applyFilters();
      };
      nc3.appendChild(b);
    });
  }
  function toRoman(n) { return ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'][n]||n; }
  const tiers = [...new Set(data.map(v=>v.tier))].sort((a,b)=>a-b);
  const tc = document.getElementById('tier-select');
  tiers.forEach(t => {
    const b = document.createElement('button');
    b.textContent = toRoman(t); b.dataset.tier = t;
    b.onclick = ()=>{ b.classList.toggle('active'); updateTierFilter(); };
    tc.appendChild(b);
  });
  document.getElementById('stat-total').textContent = data.length;
  document.getElementById('stat-premium').textContent = data.filter(v=>v.is_premium).length;
  document.getElementById('stat-newest').textContent = data.filter(v=>NEWEST_TANK_IDS.has(v.tank_id)).length;
}

function updateTierFilter() {
  filters.tiers = new Set();
  document.querySelectorAll('#tier-select button.active').forEach(b => filters.tiers.add(Number(b.dataset.tier)));
  applyFilters();
}

function applyFilters() {
  filters.premium = document.getElementById('premium-only').checked;
  filters.wheeled = document.getElementById('wheeled-only').checked;
  // newestBatches 已通过在批次按钮 onclick 中修改 Set 来维护，此处无需从 DOM 读取
  filters.search = document.getElementById('search').value.toLowerCase().trim();
  sortBy = document.getElementById('sort-by').value;
  filtered = vehicles.filter(v => {
    if (filters.nations.size > 0 && !filters.nations.has(v.nation)) return false;
    if (filters.types.size > 0 && !filters.types.has(v.type)) return false;
    if (filters.tiers.size > 0 && !filters.tiers.has(v.tier)) return false;
    if (filters.premium && !v.is_premium) return false;
    if (filters.wheeled && !v.is_wheeled) return false;
    if (filters.newestBatches.size > 0) {
      var batchInfos = NEWEST_BATCH_MAP[v.tank_id];
      if (!batchInfos) return false;
      var ok = false;
      for (var i = 0; i < NEWEST_TANK_BATCHES.length; i++) {
        if (!filters.newestBatches.has(NEWEST_TANK_BATCHES[i].date)) continue;
        for (var j = 0; j < batchInfos.length; j++) {
          if (batchInfos[j].short === NEWEST_TANK_BATCHES[i].short) { ok = true; break; }
        }
        if (ok) break;
      }
      if (!ok) return false;
    }
    if (filters.search && !v.name.toLowerCase().includes(filters.search) && !(v.short_name||'').toLowerCase().includes(filters.search) && !(TANK_NICKNAMES[v.tank_id]||'').toLowerCase().includes(filters.search)) return false;
    return true;
  });
  filtered.sort((a,b) => {
    switch(sortBy) {
      case 'tier': return a.tier - b.tier || NATION_ORDER.indexOf(a.nation) - NATION_ORDER.indexOf(b.nation);
      case 'nation': return NATION_ORDER.indexOf(a.nation) - NATION_ORDER.indexOf(b.nation) || a.tier - b.tier;
      case 'name': return a.name.localeCompare(b.name);
      case 'type': return TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type) || a.tier - b.tier;
      case 'tank_id': return a.tank_id - b.tank_id;
      default: return 0;
    }
  });
  renderGrid();
  document.getElementById('stat-shown').textContent = filtered.length;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">没有匹配的坦克</div>';
    return;
  }
  grid.innerHTML = filtered.map(v => {
    var badges = [];
    var batchInfos = NEWEST_BATCH_MAP[v.tank_id];
    var cardGlow = '';
    if (batchInfos) {
      for (var bi = 0; bi < batchInfos.length; bi++) {
        var biColor = batchInfos[bi].color;
        badges.push('<span class="badge badge-newest" style="background:'+biColor+'">' + batchInfos[bi].short + '</span>');
      }
      // 卡片发光色取第一个（最新）批次的颜色
      var glowColor = batchInfos[0].color;
      cardGlow = ' style="border-left-color:'+glowColor+';box-shadow:0 0 8px '+glowColor+'44"';
    }
    if (v.is_gift) badges.push('<span class="badge badge-gift">礼包</span>');
    if (v.is_wheeled) badges.push('<span class="badge badge-wheeled">轮式</span>');
    const img = v.images && (v.images.big_icon || v.images.contour_icon || v.images.small_icon) ? localImg(v.images.big_icon || v.images.contour_icon || v.images.small_icon) : '';
    return '<div class="card nation-bg-'+v.nation+(v.is_premium?' premium':'')+(batchInfos?' newest':'')+'"'+cardGlow+' onclick="showDetail('+v.tank_id+')">'+
      '<span style="position:absolute;top:4px;left:5px;font-size:0.62em;color:#666">#'+v.tank_id+'</span>'+
      '<span style="position:absolute;top:4px;right:5px;font-size:0.68em;color:#f90;font-weight:bold">'+toRoman(v.tier)+'</span>'+
      (v.is_premium?'<span style="position:absolute;bottom:4px;left:6px;font-size:0.58em;color:#c90;font-weight:bold">金币</span>':'')+
      '<img src="'+img+'" alt="'+v.name+'" loading="lazy" onerror="this.style.display=\'none\'">'+
      '<div class="name"><img src="images/class-icons/'+(TYPE_ICON[v.type]||'')+'" style="height:'+(v.type==='AT-SPG'||v.type==='SPG'?'0.7':'0.85')+'em;width:auto;opacity:0.55;vertical-align:middle;margin-right:5px" alt="">'+(TANK_NICKNAMES[v.tank_id]?'<span style="color:#f90;">'+TANK_NICKNAMES[v.tank_id]+'</span> ':'')+(v.short_name||v.name)+'</div>'+
      '<img src="images/flags/'+(NATION_FLAG[v.nation]||'')+'" style="position:absolute;bottom:5px;right:6px;height:0.9em;width:auto;opacity:0.5" title="'+(NATION_NAMES[v.nation]||v.nation)+'" alt="">'+
      '<div class="badges" style="min-height:1.2em">'+badges.join('')+'</div>'+
      '</div>';
  }).join('');
}

function showDetail(tankId) {
  var v = vehicles.find(function(t){return t.tank_id===tankId});
  if (!v) return;
  document.getElementById('detail-content').innerHTML = renderDetailHTML(v);
  document.getElementById('overlay').style.display = 'flex';
  updateUrlId(tankId);
}

function updateUrlId(id) {
  var url = new URL(window.location.href);
  if (id == null) url.searchParams.delete('id');
  else url.searchParams.set('id', id);
  history.replaceState(null, '', url.toString());
}

function closeDetail() {
  document.getElementById('overlay').style.display = 'none';
  updateUrlId(null);
}

document.getElementById('overlay').onclick = function(e) {
  if (e.target === this) { closeDetail(); }
};
document.querySelector('#detail .close').onclick = function(){ closeDetail(); };
document.getElementById('copyBtn').onclick = function(){
  var btn = this;
  btn.textContent = '截图中...';
  html2canvas(document.getElementById('detail'), { backgroundColor: '#222', scale: 2 }).then(function(canvas) {
    canvas.toBlob(function(blob) {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function() {
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(function(){ btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
      }).catch(function() {
        btn.textContent = '复制失败';
        setTimeout(function(){ btn.textContent = '复制'; }, 2000);
      });
    });
  }).catch(function(e) {
    console.error(e);
    btn.textContent = '截图失败';
    setTimeout(function(){ btn.textContent = '复制'; }, 2000);
  });
};
var searchInput = document.getElementById('search');
var searchClear = document.getElementById('search-clear');
searchInput.addEventListener('input', function() {
  searchClear.style.display = this.value ? 'inline' : 'none';
  applyFilters();
});
searchClear.addEventListener('click', function() {
  searchInput.value = '';
  searchClear.style.display = 'none';
  searchInput.focus();
  applyFilters();
});
document.getElementById('premium-only').addEventListener('change', applyFilters);
document.getElementById('wheeled-only').addEventListener('change', applyFilters);
document.getElementById('sort-by').addEventListener('change', applyFilters);
document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeDetail(); });
window.addEventListener('beforeunload', function() { saveFilters(); });
function saveFilters() {
  var state = {
    search: document.getElementById('search').value,
    premium: document.getElementById('premium-only').checked,
    wheeled: document.getElementById('wheeled-only').checked,
    newestBatches: Array.from(filters.newestBatches),
    sortBy: document.getElementById('sort-by').value,
    nations: Array.from(filters.nations),
    types: Array.from(filters.types),
    tiers: Array.from(filters.tiers)
  };
  localStorage.setItem('wot-filters', JSON.stringify(state));
}

function restoreFilters() {
  var raw = localStorage.getItem('wot-filters');
  if (!raw) return;
  try {
    var state = JSON.parse(raw);
    document.getElementById('search').value = state.search || '';
    if (state.search) { searchClear.style.display = 'inline'; }
    document.getElementById('premium-only').checked = state.premium || false;
    document.getElementById('wheeled-only').checked = state.wheeled || false;
    document.getElementById('sort-by').value = state.sortBy || 'tier';
    filters.newestBatches = new Set(state.newestBatches || []);
    filters.nations = new Set(state.nations || []);
    filters.types = new Set(state.types || []);
    filters.tiers = new Set(state.tiers || []);
    document.querySelectorAll('#type-filter > span').forEach(function(b) {
      if (filters.types.has(b.dataset.type)) {
        b.style.borderColor = '#f90'; b.style.background = '#3a3000';
      }
    });
    document.querySelectorAll('#nation-filter > span').forEach(function(b) {
      if (filters.nations.has(b.dataset.nation)) {
        b.style.borderColor = '#f90'; b.style.background = '#3a3000'; b.style.color = '#f90';
      }
    });
    document.querySelectorAll('#tier-select button').forEach(function(b) {
      if (filters.tiers.has(Number(b.dataset.tier))) b.classList.add('active');
    });
    document.querySelectorAll('#newest-filter > span').forEach(function(b) {
      if (filters.newestBatches.has(b.dataset.batchDate)) {
        var bc = b.style.color; // 按钮的文字色就是批次色
        b.style.borderColor = bc;
        b.style.background = bc + '22';
      }
    });
    applyFilters();
  } catch(e) {}
}

(function() {
  function setFingerprint(key, val) {
    if (!localStorage.getItem(key)) localStorage.setItem(key, val);
  }
  setFingerprint('wot-fp-data', JSON.stringify(VEHICLES_JSON.data).length);
  setFingerprint('wot-fp-html', document.documentElement.outerHTML.length);

  var files = [
    {url:'tank-data/vehicles_data.js', key:'wot-fp-data', extract:function(t){
      var m = t.match(/VEHICLES_JSON\s*=\s*(\{[\s\S]*\});/);
      return m ? m[1].length : 0;
    }},
    {url:'tank-data/tank_nicknames.js', key:'wot-fp-nick', extract:function(t){ return t.length; }},
    {url:'tank-data/tank_newest.js', key:'wot-fp-newest', extract:function(t){ return t.length; }},
    {url:'wot-tanks.html', key:'wot-fp-html', extract:function(t){ return t.length; }}
  ];

  function poll() {
    var changed = false;
    Promise.allSettled(files.map(function(f) {
      return fetch(f.url + '?t=' + Date.now(), {cache:'no-cache'})
        .then(function(r) { return r.text(); })
        .then(function(txt) {
          var fp = f.extract(txt);
          if (fp && Number(localStorage.getItem(f.key)) !== fp) {
            localStorage.setItem(f.key, fp);
            changed = true;
          }
        });
    })).then(function() {
      if (changed) { saveFilters(); location.reload(); }
    });
  }
  setInterval(poll, 30000);
  poll();
})();

document.getElementById('reset-filters').addEventListener('click', function() {
  document.getElementById('search').value = '';
  searchClear.style.display = 'none';
  document.getElementById('type-filter').value = '';
  document.getElementById('premium-only').checked = false;
  document.getElementById('wheeled-only').checked = false;
  document.getElementById('sort-by').value = 'tier';
  filters.newestBatches.clear();
  filters.nations.clear();
  filters.types.clear();
  filters.tiers.clear();
  document.querySelectorAll('#type-filter > span').forEach(function(b) {
    b.style.borderColor = '#555';
    b.style.background = '#333';
  });
  document.querySelectorAll('#nation-filter > span').forEach(function(b) {
    b.style.borderColor = '#555';
    b.style.background = '#333';
    b.style.color = '#aaa';
  });
  document.querySelectorAll('#tier-select button.active').forEach(function(b) {
    b.classList.remove('active');
  });
  document.querySelectorAll('#newest-filter > span').forEach(function(b) {
    b.style.borderColor = '#555';
    b.style.background = '#333';
  });
  applyFilters();
});
function scrollToTop() {
  var s = window.scrollY, step = s / 8;
  function f() {
    if (window.scrollY > 0) { window.scrollBy(0, -Math.max(step, 30)); requestAnimationFrame(f); }
  }
  requestAnimationFrame(f);
}
var btt = document.getElementById('back-to-top');
window.addEventListener('scroll', function() {
  btt.style.display = window.scrollY > 300 ? 'flex' : 'none';
});
init();
restoreFilters();

// 按坦克 ID 深链接：打开 ?id=<tank_id> 直达对应坦克详情
(function() {
  var id = Number(new URLSearchParams(window.location.search).get('id'));
  if (id && vehicles.some(function(v){ return v.tank_id === id; })) {
    showDetail(id);
  }
})();
</script>
</body>
</html>
